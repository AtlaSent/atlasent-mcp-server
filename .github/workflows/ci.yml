name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: One license (Apache-2.0) across server, packages and plugin manifests
        run: |
          node scripts/check-package-licenses.mjs --self-test
          node scripts/check-package-licenses.mjs
      # The MCPB bundle (Smithery stdio listing, Claude Desktop) is the same
      # dist/ packed with prod deps; build + validate it on one leg only.
      - name: Build and validate the MCPB bundle
        if: matrix.node-version == 22
        run: node scripts/build-mcpb.mjs --out mcpb-out
      - uses: actions/upload-artifact@v7
        if: matrix.node-version == 22
        with:
          name: mcpb-bundle
          path: mcpb-out/*.mcpb
          retention-days: 30

  # atlasent-guard, the Claude Code plugin in packages/agent-hooks. Zero dependencies.
  # Its tests drive the real CLI with Claude Code's stdin payload, so this job proves
  # the hook blocks, not just that a rule table parses. Node 18 is the declared floor.
  # Tests live in packages/agent-hooks-test, outside the plugin folder: the plugin installs
  # that whole folder, and the redaction fixtures look like real secrets to a scanner.
  agent-hooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 22]
    defaults:
      run:
        working-directory: packages/agent-hooks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Unit and end-to-end hook tests
        run: node --test ../agent-hooks-test/*.node.mjs
      - name: A destructive command is actually refused through the CLI
        run: |
          set -euo pipefail
          export ATLASENT_HOOKS_HOME="$RUNNER_TEMP/ah"
          out=$(printf '%s' '{"hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"terraform destroy -auto-approve"},"permission_mode":"bypassPermissions","cwd":"/tmp"}' | node cli.mjs claude-code)
          echo "$out"
          echo "$out" | node -e 'const o=JSON.parse(require("fs").readFileSync(0,"utf8")); if (o.hookSpecificOutput.permissionDecision !== "deny") { console.error("expected deny"); process.exit(1); }'

  # @atlasent/mcp-gate is a separate package with its own Node floor (>=22, so it
  # cannot ride the 18/20/22 matrix above) and zero npm dependencies, so there is
  # nothing to install.
  #
  # The unit tests alone are not the proof that matters. This package's whole claim
  # is "every tool call is blocked until you write a rule", so the job also runs the
  # real setup and drives an actual destructive tools/call through the gate,
  # asserting it comes back blocked. A green unit suite over a gate that had silently
  # stopped blocking would be exactly the shape of failure this repo keeps finding
  # elsewhere.
  mcp-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests
        run: node --test test/*.node.mjs

      - name: Setup generates a deny-by-default policy
        run: |
          set -euo pipefail
          node cli.mjs setup "$RUNNER_TEMP/gate" -- node "$PWD/demo-server.mjs"
          echo "--- generated policy.json ---"
          cat "$RUNNER_TEMP/gate/policy.json"
          node -e '
            const p = require("fs").readFileSync(process.env.RUNNER_TEMP + "/gate/policy.json", "utf8");
            const j = JSON.parse(p);
            if (j.default !== "deny") { console.error("policy default is not deny:", j.default); process.exit(1); }
            if (!Array.isArray(j.rules) || j.rules.length !== 0) { console.error("policy did not start with zero rules"); process.exit(1); }
          '

      - name: A destructive tool call is actually blocked
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"set_status","arguments":{"environment":"production","status":"deleted"}}}' \
            | timeout 30 node cli.mjs run-dir "$RUNNER_TEMP/gate/policy.json" "$RUNNER_TEMP/gate/activity" \
                -- node "$PWD/demo-server.mjs" > out.jsonl
          echo "--- gate output ---"; cat out.jsonl
          grep '"id":2' out.jsonl | grep -q 'Blocked by AtlaSent Gate' \
            || { echo "::error::the gate did NOT block a destructive call"; exit 1; }

      - name: Activity evidence stays metadata-only
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP"/gate/activity/*.jsonl
          if grep -qE 'set_status|production|deleted' "$RUNNER_TEMP"/gate/activity/*.jsonl; then
            echo "::error::activity file leaked a tool name or arguments; it must be metadata-only"
            exit 1
          fi

      # The package's README documents a reference acceptance run against the
      # OFFICIAL MCP SDK client and a real third-party server, and claimed "CI
      # repeats this on Node 22 and 24". It did not: this repo published
      # @atlasent/mcp-gate while running that test nowhere. It ran only in
      # atlasent-llm-integrations, against the unpublished copy of the package,
      # so the artifact customers install was the less-tested one.
      #
      # Folded in as STEPS rather than a new job on purpose: GitHub bills per job,
      # rounded up to the minute, and this job is already paying for its minute.
      #
      # Two details are load-bearing. The reference server is installed OUTSIDE
      # the gate package, because the claim being tested is that the gate has no
      # dependency on the server it proxies -- installing into packages/mcp-gate
      # would quietly falsify it. And the version is pinned: an unpinned
      # reference server turns a green run into a statement about whatever npm
      # served that morning.
      - name: Install reference MCP server outside the Gate package
        run: npm install --prefix "$RUNNER_TEMP/mcp-reference" --ignore-scripts @modelcontextprotocol/server-filesystem@2026.8.31

      - name: Verify official SDK and filesystem server compatibility
        run: node test/reference-acceptance.mjs "$RUNNER_TEMP/mcp-reference/node_modules"

  # The Dockerfile is what Glama (glama.ai/mcp/servers) builds to start the
  # server and introspect its tools. Keep it building and answering
  # tools/list with no credentials, so the listing never goes stale.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t atlasent-mcp .
      - name: tools/list over stdio in local mode
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 30 docker run -i --rm atlasent-mcp > out.jsonl
          grep -q '"id":2' out.jsonl
          grep '"id":2' out.jsonl | grep -q '"name":"evaluate"'
