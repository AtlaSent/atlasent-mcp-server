name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write   # cosign keyless OIDC
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify version tag matches package.json
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json version ${PKG_VERSION}"

      # ── AtlaSent release gate ────────────────────────────────────────
      # Gate closed: if the permit is not verified the job exits here and
      # nothing builds or publishes.
      #
      # Two bugs fixed here (found during a dogfooding audit of consequential
      # actions AtlaSent's own coding agents can take against AtlaSent's own
      # infrastructure), neither a policy judgment call -- both mechanical:
      #   1. `action: production.release` is NOT in atlasent-action's
      #      GATE_PERMITTED_ACTIONS allowlist (src/canonicalAction.ts:
      #      production.deploy | package.release | the three trial.* actions
      #      only). Every real dispatch of this step self-rejected with
      #      "unsupported protected action" before ever calling the AtlaSent
      #      API -- fail-closed, but on a typo, not a real policy check.
      #      `package.release` is the canonical "publish a package" action
      #      (atlasent-action's own release.yml, atlasent-sdk's 13 npm/PyPI
      #      publish gates, atlasent-api's seed_package_release_bundle()).
      #   2. No `api-url` / `ATLASENT_BASE_URL` was set, so this fell back to
      #      atlasent-action's built-in default (api.atlasent.io/functions/v1)
      #      -- a custom apex other repos' own gate scripts flag as unproven
      #      ("only once the apex CDN forwards /v1-* paths"). Pointing
      #      directly at the runtime project's Supabase URL, matching every
      #      other gate wired this audit.
      - name: AtlaSent release gate
        uses: AtlaSent/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
        with:
          action: package.release
          actor: ${{ github.actor }}
          environment: production
          api-url: https://kttccumlnmdtupgbyfue.supabase.co/functions/v1
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}"}'

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Pack tarball
        run: |
          npm pack
          PKG=$(ls *.tgz | head -1)
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Sign tarball (cosign keyless)
        # Keyless OIDC cert via Sigstore Fulcio — no private key in secrets.
        run: cosign sign-blob --yes --bundle="${PKG}.bundle" "${PKG}"

      # npm trusted publishing (OIDC): npm authenticates this exact workflow
      # via the job's id-token, so there is no long-lived NPM_TOKEN to expire,
      # leak, or be mis-pasted. Configured on npmjs.com -> @atlasent/mcp-server
      # -> Settings -> Trusted Publisher (repo AtlaSent/atlasent-mcp-server,
      # workflow publish.yml, environment npm). Requires npm >= 11.5.1; the
      # Node 22 runner ships npm 10.x, hence the upgrade. The repo is public,
      # so provenance (publishConfig.provenance) is attached as well, alongside
      # the cosign bundle above.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Publish to npm
        run: npm publish --access public

      - name: Upload cosign bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: cosign-bundle
          path: "*.bundle"
          if-no-files-found: error
