# Smithery configuration — https://smithery.ai/docs/build/project-config/smithery.yaml

startCommand:
  type: stdio

configSchema:
  type: object
  properties:
    apiKey:
      type: string
      description: "AtlaSent API key: sign up free at console.atlasent.io and choose Connect an AI agent. Leave blank for the local demo mode."
    baseUrl:
      type: string
      description: "AtlaSent API base URL. Leave blank to use the hosted SaaS endpoint (api.atlasent.io)."
      default: "https://api.atlasent.io/functions/v1"
    mode:
      type: string
      description: "local (default with no apiKey: offline rules engine, unsigned permits, dev only) or remote (hosted AtlaSent API)"
      enum: ["remote", "local"]

commandFunction: |-
  (config) => ({
    command: 'npx',
    args: ['-y', '@atlasent/mcp-server'],
    env: {
      ...(config.apiKey ? { ATLASENT_API_KEY: config.apiKey } : {}),
      ...(config.baseUrl ? { ATLASENT_BASE_URL: config.baseUrl } : {}),
      ...(config.mode ? { ATLASENT_MODE: config.mode } : {})
    }
  })
