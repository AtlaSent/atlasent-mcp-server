# Example OpenShell base policy for an agent whose consequential writes are
# mediated by AtlaSent. OpenShell should remain default-deny for direct write
# destinations; only the AtlaSent adapter gets authority API access through the
# attached AtlaSent provider profile.
filesystem:
  read_only:
    - /usr
    - /lib
    - /etc
  read_write:
    - /workspace
    - /tmp
network_policies: {}
